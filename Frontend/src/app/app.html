<div
  class="h-dvh flex flex-col overflow-hidden bg-ink-950"
  [class.reduce-motion]="prefs.prefs().reduceMotion"
>
  <app-topbar />

  <div class="shrink-0 px-3 sm:px-4 pt-2">
    <app-business-selector />
  </div>

  <div class="flex-1 flex min-h-0 mt-2">
    <!-- Desktop conversation rail -->
    <aside class="hidden lg:flex w-72 shrink-0 flex-col min-h-0 border-r hairline">
      <app-sidebar-nav />
    </aside>

    <!-- Chat workspace -->
    <main class="flex-1 min-w-0 flex flex-col min-h-0">
      <app-chat-window />
    </main>

    <!-- Desktop insights rail -->
    <aside class="hidden xl:flex w-[380px] shrink-0 flex-col min-h-0 border-l hairline">
      <app-dashboard />
    </aside>
  </div>

  <!-- Mobile: conversations drawer (Bootstrap offcanvas) -->
  @if (ui.conversationsOpen()) {
    <div class="fixed inset-0 z-1040 bg-black/60 lg:hidden" (click)="ui.closeAll()"></div>
  }
  <div
    class="offcanvas offcanvas-start offcanvas-mobile surface lg:hidden"
    [class.show]="ui.conversationsOpen()"
    style="width: 19rem; border: none;"
  >
    <div class="h-full flex flex-col">
      <div class="flex items-center justify-between px-4 h-12 border-b hairline shrink-0">
        <span class="font-display text-sm font-semibold">Conversations</span>
        <button type="button" class="icon-btn" (click)="ui.closeAll()">
          <app-icon name="close" size="15" />
        </button>
      </div>
      <div class="flex-1 min-h-0">
        <app-sidebar-nav (close)="ui.closeAll()" />
      </div>
    </div>
  </div>

  <!-- Mobile / tablet: insights drawer (Bootstrap offcanvas bottom) -->
  @if (ui.insightsOpen()) {
    <div class="fixed inset-0 z-1040 bg-black/60 xl:hidden" (click)="ui.closeAll()"></div>
  }
  <div
    class="offcanvas offcanvas-bottom offcanvas-mobile surface xl:hidden"
    [class.show]="ui.insightsOpen()"
    style="height: 78dvh; border: none; border-radius: 1rem 1rem 0 0;"
  >
    <div class="h-full flex flex-col">
      <div class="flex justify-center pt-2 shrink-0">
        <span class="w-10 h-1 rounded-full bg-ink-600"></span>
      </div>
      <div class="flex-1 min-h-0">
        <app-dashboard />
      </div>
    </div>
  </div>

  <!-- Mobile bottom navigation -->
  <nav class="lg:hidden shrink-0 grid grid-cols-3 border-t hairline surface pb-[env(safe-area-inset-bottom)]">
    <button type="button" class="mob-nav-btn" (click)="ui.openConversations()">
      <app-icon name="chat" size="17" />
      Chats
    </button>
    <button type="button" class="mob-nav-btn" [class.text-accent-300]="!ui.conversationsOpen() && !ui.insightsOpen()" (click)="ui.closeAll()">
      <app-icon name="spark" size="17" />
      Assistant
    </button>
    <button type="button" class="mob-nav-btn" (click)="ui.openInsights()">
      <app-icon name="chart" size="17" />
      Insights
    </button>
  </nav>
</div>
